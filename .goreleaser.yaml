version: 2
project_name: samverk

builds:
  - id: samverk
    main: ./cmd/samverk/
    binary: samverk
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X samverk.dev/samverk/internal/version.Version={{.Version}}
      - -X samverk.dev/samverk/internal/version.GitCommit={{.Commit}}
      - -X samverk.dev/samverk/internal/version.BuildDate={{.Date}}

archives:
  - id: samverk
    name_template: "samverk_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat'
    - title: Bug Fixes
      regexp: '^fix'
    - title: Documentation
      regexp: '^docs'
    - title: Other
      order: 999
