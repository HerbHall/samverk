# Samverk AI Provider Registry
# Configure which AI providers are available for agent work.

providers:
  claude-haiku:
    type: claude-cli
    default_model: claude-haiku-4-5-20251001
    # default timeout (300s) is sufficient for triage/simple tasks

  claude-sonnet:
    type: claude-cli
    default_model: claude-sonnet-4-6
    timeout_seconds: 600  # 10 min for standard code-gen and research

  claude-opus:
    type: claude-cli
    default_model: claude-opus-4-6
    timeout_seconds: 900  # 15 min for complex/architectural tasks

  ollama-coder:
    type: ollama
    base_url: http://192.168.1.207:11434
    default_model: qwen2.5-coder:7b

# Routing chains: tried in order, first healthy provider wins.
# Non-default chains include claude-sonnet as a fallback.
routing:
  # Fast, cheap: label changes, status updates, simple research
  triage:   [claude-haiku, claude-sonnet]

  # Default workhorse: most code-gen, research, docs, tests
  default:  [claude-sonnet]

  # Heavy lifting: architectural decisions, complex refactors
  complex:  [claude-opus, claude-sonnet]

  # Free local inference: boilerplate code-gen, simple edits
  local:    [ollama-coder, claude-sonnet]

  # Frontend SPA work
  frontend: [claude-sonnet]
