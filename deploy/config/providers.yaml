# Samverk AI Provider Registry

providers:
  claude-haiku:
    type: claude-cli
    default_model: claude-haiku-4-5-20251001
    allowed_tools: "Bash,Read,Edit,Write,Glob,Grep"
    max_turns: 25

  claude-sonnet:
    type: claude-cli
    default_model: claude-sonnet-4-6
    timeout_seconds: 600
    allowed_tools: "Bash,Read,Edit,Write,Glob,Grep"
    max_turns: 25

  claude-opus:
    type: claude-cli
    default_model: claude-opus-4-6
    timeout_seconds: 900
    allowed_tools: "Bash,Read,Edit,Write,Glob,Grep"
    max_turns: 25

  claudecli-nzxt:
    type: claude-cli
    base_url: http://192.168.1.202:11434
    default_model: qwen3-coder:30b
    timeout_seconds: 600
    allowed_tools: "Bash,Read,Edit,Write,Glob,Grep"
    max_turns: 25

  claudecli-vm300:
    type: claude-cli
    base_url: http://192.168.1.207:11434
    default_model: qwen2.5-coder:32b
    timeout_seconds: 600
    allowed_tools: "Bash,Read,Edit,Write,Glob,Grep"
    max_turns: 25

  ollama-nzxt:
    type: ollama
    base_url: http://192.168.1.202:11434
    default_model: qwen3-coder:30b
    timeout_seconds: 600
    gpu: true
    wol_mac: "E8-9C-25-78-69-D6"

  ollama-vm300:
    type: ollama
    base_url: http://192.168.1.207:11434
    default_model: qwen2.5-coder:32b
    timeout_seconds: 600
    gpu: true

  ollama-cmasus:
    type: ollama
    base_url: http://100.88.37.47:11434
    default_model: qwen2.5-coder:7b
    timeout_seconds: 300
    gpu: true
    wol_mac: "FC-34-97-A5-27-E4"

routing:
  triage:   [ollama-cmasus, ollama-vm300, claude-haiku]
  default:  [ollama-nzxt, claude-sonnet]
  code-gen: [claude-sonnet, claude-haiku]
  complex:  [claude-opus, claude-sonnet]
  local:    [ollama-nzxt, ollama-vm300, ollama-cmasus, claude-sonnet]
  frontend:  [claude-sonnet]
  local-cc:  [claudecli-nzxt, claudecli-vm300, claude-sonnet]
