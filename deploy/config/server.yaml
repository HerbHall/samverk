# Samverk Multi-Project Configuration
# Add additional projects to manage beyond the default --owner/--repo.
#
# forge: "github" (default) or "gitea"
# Gitea projects require gitea_url. gitea_token is optional and falls back
# to the GITEA_TOKEN environment variable if unset.
#
# A single repository can be listed twice to watch both forges simultaneously:

projects: []
  # GitHub project (default forge):
  # - name: samverk
  #   owner: herbhall
  #   repo: samverk
  #   forge: github
  #
  # Same repo on self-hosted Gitea:
  # - name: samverk-gitea
  #   owner: samverk
  #   repo: samverk
  #   forge: gitea
  #   gitea_url: https://gitea.herbhall.net
  #   gitea_token: ""   # omit to use GITEA_TOKEN env var
