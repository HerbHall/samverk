name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for commits since last nightly
        id: check
        run: |
          RECENT=$(git log --since="24 hours ago" --oneline origin/main | head -1)
          if [ -n "$RECENT" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes found since last nightly"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes in last 24 hours, skipping build"
          fi

  binaries:
    name: Nightly Binaries
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Embed frontend in Go binary
        run: |
          rm -rf internal/dashboard/dist
          cp -r web/dist internal/dashboard/dist

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          go build -ldflags "\
            -s -w \
            -X github.com/HerbHall/samverk/internal/version.Version=nightly-${DATE}-${SHORT_SHA} \
            -X github.com/HerbHall/samverk/internal/version.GitCommit=${SHORT_SHA} \
            -X github.com/HerbHall/samverk/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "samverk-${GOOS}-${GOARCH}${EXT}" ./cmd/samverk/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            samverk-*
          retention-days: 7
