# Copilot coding agent build environment for HerbHall/samverk
steps:
  - name: Install Go
    run: |
      sudo apt-get update -q
      sudo apt-get install -y wget
      wget -q https://go.dev/dl/go1.25.0.linux-amd64.tar.gz
      sudo rm -rf /usr/local/go
      sudo tar -C /usr/local -xzf go1.25.0.linux-amd64.tar.gz
      echo "/usr/local/go/bin" >> $GITHUB_PATH
      echo "$HOME/go/bin" >> $GITHUB_PATH
  - name: Install Node.js and pnpm
    run: |
      curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
      sudo apt-get install -y nodejs
      npm install -g pnpm
  - name: Install golangci-lint
    run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
  - name: Install Go dependencies
    run: go mod download
  - name: Install web dependencies
    run: cd web && pnpm install --no-frozen-lockfile
