name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install trivy
        run: |
          which curl >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq curl)
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version

      # Scan Go modules and project files only. Skip node_modules and
      # web build artifacts — those are dev-time dependencies not shipped
      # in the deployed Go binary (SPA is embedded at build time).
      - name: Scan filesystem
        run: |
          trivy fs --exit-code 1 --severity HIGH,CRITICAL \
            --skip-dirs web/node_modules \
            --skip-dirs node_modules \
            --skip-dirs web/dist \
            --skip-dirs .git \
            .
